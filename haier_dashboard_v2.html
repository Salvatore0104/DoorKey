<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>501 可视对讲</title>
  <style>
    :root{color-scheme:dark;--bg:#080c11;--panel:#111823;--panel2:#0c121a;--line:#253142;--text:#edf4fb;--muted:#8c9aad;--green:#43d17b;--amber:#ffbd4a;--red:#ff6470;--blue:#4aa8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#172537 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand h1{font-size:24px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#111923;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px currentColor}.dot.ok{background:var(--green)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{background:linear-gradient(180deg,#131b26,#0f161f);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px #0006}.head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:14px}.pill{font-size:11px;color:var(--muted);background:#1a2431;border-radius:7px;padding:5px 8px}.media{position:relative;min-height:390px;background:#030508;display:grid;place-items:center}.media video{width:100%;height:100%;min-height:390px;object-fit:contain;background:#030508}.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.ring{display:none;text-align:center}.ring.show{display:block}.ring-icon{width:92px;height:92px;border:1px solid var(--green);border-radius:50%;display:grid;place-items:center;margin:auto;font-size:38px;box-shadow:0 0 0 10px #43d17b12,0 0 50px #43d17b42;animation:pulse 1.4s infinite}.ring h3{font-size:26px;margin:18px 0 5px}.ring p{margin:0;color:var(--muted)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}.btn{border:1px solid var(--line);background:#182231;color:var(--text);border-radius:11px;padding:12px 10px;font-weight:700;cursor:pointer}.btn:hover:not(:disabled){border-color:#40536b;background:#202d3d}.btn.primary{background:#176f45;border-color:#248c5a}.btn.danger{background:#60242c;border-color:#85343e}.btn.unlock{background:#8b5b0e;border-color:#b77a18}.btn:disabled{opacity:.38;cursor:not-allowed}.volume{display:flex;align-items:center;gap:10px;padding:0 16px 15px;color:var(--muted);font-size:12px}.volume input{flex:1}.side{display:grid;gap:16px;align-content:start}.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--line);gap:1px}.stat{background:#101720;padding:14px 16px}.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.stat strong{font-size:15px;font-variant-numeric:tabular-nums}.notice{padding:15px 17px;font-size:13px;line-height:1.6;color:var(--muted)}.notice.warn{color:#e9bf73;background:#231c10}.login{padding:15px 17px;display:grid;gap:10px}.login-row{display:flex;gap:8px}.login input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;background:#0a1017;color:var(--text);padding:10px}.logs{grid-column:1/-1}.logbox{height:330px;overflow:auto;background:#080c11;font-family:"Cascadia Mono",Consolas,monospace}.row{display:grid;grid-template-columns:155px 54px 1fr;gap:10px;padding:8px 16px;border-bottom:1px solid #16202b;font-size:12px;line-height:1.45}.row:hover{background:#0f1720}.time{color:#647487}.dir{font-weight:800}.dir.RX{color:var(--green)}.dir.TX{color:var(--blue)}.dir.STATE{color:var(--amber)}.dir.AUTH{color:#be8cff}.hex{display:block;color:#607084;word-break:break-all;margin-top:3px}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:12px 15px;border-radius:10px;background:#192331;border:1px solid #40516a;box-shadow:0 10px 30px #0009;display:none}.toast.show{display:block}.toast.error{border-color:#8c3a45;color:#ffadb4}@keyframes pulse{50%{box-shadow:0 0 0 19px #43d17b08,0 0 60px #43d17b56}}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.logs{grid-column:auto}.media,.media video{min-height:300px}.controls{grid-template-columns:1fr 1fr}.row{grid-template-columns:92px 44px 1fr}.top{align-items:flex-start}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><h1>501 可视对讲</h1><p>HR-6107 软件终端 · 172.30.2.47</p></div><div class="status"><i id="dot" class="dot"></i><span id="listener">连接中</span></div></header>
  <section class="grid">
    <article class="card">
      <div class="head"><h2>门口实时画面</h2><span id="callState" class="pill">IDLE</span></div>
      <div class="media"><video id="remoteVideo" autoplay playsinline></video><div class="overlay"><div id="ring" class="ring"><div class="ring-icon">☎</div><h3>501 正在呼叫</h3><p>门口机 172.30.2.36</p></div></div></div>
      <div class="controls"><button id="mediaBtn" class="btn">连接媒体</button><button id="answerBtn" class="btn primary" disabled>接听</button><button id="rejectBtn" class="btn danger" disabled>拒绝</button><button id="hangupBtn" class="btn danger" disabled>挂断</button><button id="unlockBtn" class="btn unlock" disabled>开门</button></div>
      <div class="volume"><button id="muteBtn" class="btn">静音</button><span>音量</span><input id="volume" type="range" min="0" max="1" value="1" step="0.05"><button id="notifyBtn" class="btn">启用通知</button></div>
    </article>
    <aside class="side">
      <article class="card"><div class="head"><h2>终端状态</h2><span class="pill">实时</span></div><div class="stats"><div class="stat"><span>来电次数</span><strong id="calls">0</strong></div><div class="stat"><span>最后来电</span><strong id="lastCall">—</strong></div><div class="stat"><span>控制端口</span><strong>46752</strong></div><div class="stat"><span>视频包</span><strong id="videoPackets">0</strong></div><div class="stat"><span>音频包</span><strong id="audioPackets">0</strong></div><div class="stat"><span>RX / TX</span><strong><span id="rx">0 B</span> / <span id="tx">0 B</span></strong></div></div></article>
      <article id="authCard" class="card"><div class="head"><h2>访问认证</h2><span id="authState" class="pill">未登录</span></div><div class="login"><div class="login-row"><input id="token" type="password" placeholder="粘贴 .hr6107_api_token"><button id="loginBtn" class="btn">登录</button></div><small>仅在启用远程认证时需要令牌。</small></div></article>
      <article id="profileNotice" class="card notice warn">901双向协议尚未验证。接听、挂断、开门和麦克风上行保持禁用；页面不会猜测或重放门禁命令。</article>
    </aside>
    <article class="card logs"><div class="head"><h2>实时收发日志</h2><span class="pill">WebSocket</span></div><div id="logbox" class="logbox"></div></article>
  </section>
</main>
<div id="toast" class="toast"></div>
<script>
let state=null,lastId=0,authenticated=false,pc=null,remoteStream=null,ws=null,lastNotifyAt=0;
const $=s=>document.querySelector(s),fmt=n=>n<1024?`${n} B`:`${(n/1024).toFixed(1)} KB`;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');setTimeout(()=>el.className='toast',3500)}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||d.error||`HTTP ${r.status}`);return d}
function render(s){const old=state;state=s;if(!s.auth_required){authenticated=true;$('#authCard').style.display='none'}else{$('#authCard').style.display=''}const online=s.listener==='online';$('#dot').classList.toggle('ok',online);$('#listener').textContent=online?'监听正常':'监听离线';$('#callState').textContent=s.call_state;$('#calls').textContent=s.call_count;$('#lastCall').textContent=s.last_call?String(s.last_call).slice(11):'—';$('#videoPackets').textContent=s.video_packets;$('#audioPackets').textContent=s.audio_packets;$('#rx').textContent=fmt(s.rx_bytes);$('#tx').textContent=fmt(s.tx_bytes);$('#ring').classList.toggle('show',s.call_state==='RINGING');$('#answerBtn').disabled=!(authenticated&&s.actions.answer&&s.call_state==='RINGING');$('#rejectBtn').disabled=!(authenticated&&s.call_state==='RINGING');$('#hangupBtn').disabled=!(authenticated&&s.actions.hangup&&['RINGING','CONNECTING','ACTIVE'].includes(s.call_state));$('#unlockBtn').disabled=!(authenticated&&s.actions.unlock&&(s.actions.unlock_idle_enabled||s.call_state==='ACTIVE'));$('#unlockBtn').textContent=s.call_state==='ACTIVE'?'开门':(s.actions.unlock_idle_enabled?'开门':'开门(仅通话中)');$('#profileNotice').textContent=s.protocol.verified?'901双向协议已验证，控制功能已启用。':'901双向协议尚未验证。接听、挂断、开门和麦克风上行保持禁用；页面不会猜测或重放门禁命令。';if((!old||old.call_state!=='RINGING')&&s.call_state==='RINGING')notifyCall()}
async function refresh(){try{render(await api('/api/state'))}catch(e){$('#listener').textContent='服务断开'}}
function appendEvent(e){lastId=Math.max(lastId,e.id||0);const row=document.createElement('div');row.className='row';const t=String(e.time||'').replace('T',' ').slice(0,23);const data=e.data||{};row.innerHTML=`<span class="time">${t}</span><span class="dir ${e.direction}">${e.direction}</span><span>${e.message}${data.hex?`<code class="hex">${data.hex}</code>`:''}</span>`;const box=$('#logbox');box.appendChild(row);while(box.children.length>300)box.firstElementChild.remove();box.scrollTop=box.scrollHeight}
async function loadLogs(){const d=await api(`/api/logs?after=${lastId}`);d.events.forEach(appendEvent)}
function openWs(){if(ws)ws.close();ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/events`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='event')appendEvent(m.data);if(m.type==='state')render(m.data)};ws.onclose=()=>setTimeout(()=>authenticated&&openWs(),2000)}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({token:$('#token').value})});authenticated=true;$('#authState').textContent='已登录';$('#token').value='';openWs();await refresh();toast('认证成功')}catch(e){toast(e.message,true)}}
async function action(path,label){try{const d=await api(path,{method:'POST',body:'{}'});toast(`${label}请求成功`);await refresh();return d}catch(e){toast(e.message,true)}}
async function connectMedia(withMic=false){try{if(pc)pc.close();pc=new RTCPeerConnection();remoteStream=new MediaStream();$('#remoteVideo').srcObject=remoteStream;pc.ontrack=e=>remoteStream.addTrack(e.track);pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});if(withMic){const local=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});local.getTracks().forEach(t=>pc.addTrack(t,local))}const offer=await pc.createOffer();await pc.setLocalDescription(offer);const answer=await api('/api/webrtc/offer',{method:'POST',body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type})});await pc.setRemoteDescription(answer);toast('媒体通道已连接')}catch(e){toast(`媒体连接失败：${e.message}`,true)}}
function notifyCall(){const now=Date.now();if(now-lastNotifyAt<10000)return;lastNotifyAt=now;if(Notification.permission==='granted')new Notification('501 门禁来电',{body:'门口机 172.30.2.36 正在呼叫',tag:'hr6107-call',renotify:false});try{new Audio('data:audio/wav;base64,UklGRjQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YRAAAACA////gP///4D///+A////').play()}catch{}}
$('#loginBtn').onclick=login;$('#answerBtn').onclick=async()=>{await action('/api/call/answer','接听');await connectMedia(true)};$('#rejectBtn').onclick=()=>action('/api/call/reject','拒绝');$('#hangupBtn').onclick=()=>action('/api/call/hangup','挂断');$('#unlockBtn').onclick=()=>action('/api/unlock','开门');$('#mediaBtn').onclick=()=>connectMedia(false);$('#muteBtn').onclick=()=>{const v=$('#remoteVideo');v.muted=!v.muted;$('#muteBtn').textContent=v.muted?'取消静音':'静音'};$('#volume').oninput=e=>$('#remoteVideo').volume=e.target.value;$('#notifyBtn').onclick=async()=>{const p=await Notification.requestPermission();toast(`通知权限：${p}`)};
async function restoreSession(){try{await api('/api/auth');authenticated=true;$('#authState').textContent='已登录';openWs()}catch{}await refresh()}
restoreSession();loadLogs();setInterval(refresh,700);setInterval(()=>!authenticated&&loadLogs(),1500);
</script>
</body>
</html>
